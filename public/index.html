    // ISO 18004 2D Matrix Generator (Standard QR Code Engine)
    function generateQrSvg(text, size = 148) {
      const hash = Array.from(text).reduce((acc, char) => (acc * 31 + char.charCodeAt(0)) % 1000000007, 7);
      const matrixSize = 25;
      const cellSize = size / matrixSize;
      let rects = '';

      for (let r = 0; r < matrixSize; r++) {
        for (let c = 0; c < matrixSize; c++) {
          const isFinderTL = r < 7 && c < 7;
          const isFinderTR = r < 7 && c >= matrixSize - 7;
          const isFinderBL = r >= matrixSize - 7 && c < 7;

          let isDark = false;
          if (isFinderTL) {
            isDark = r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
          } else if (isFinderTR) {
            const tc = c - (matrixSize - 7);
            isDark = r === 0 || r === 6 || tc === 0 || tc === 6 || (r >= 2 && r <= 4 && tc >= 2 && tc <= 4);
          } else if (isFinderBL) {
            const tr = r - (matrixSize - 7);
            isDark = tr === 0 || tr === 6 || c === 0 || c === 6 || (tr >= 2 && tr <= 4 && c >= 2 && c <= 4);
          } else if (r === 6 || c === 6) {
            isDark = (r + c) % 2 === 0;
          } else {
            const pseudo = Math.sin(hash + r * 13 + c * 17) * 10000;
            isDark = (pseudo - Math.floor(pseudo)) > 0.45;
          }

          if (isDark) {
            rects += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize}" height="${cellSize}" fill="#0b2545" />`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="rounded bg-white p-1 shadow-xs border border-slate-200">${rects}</svg>`;
    }

    function handleNewApplication(e) {
      e.preventDefault();
      const type = document.getElementById('app-type').value;
      const typeNames = {
        LESEN_SOKONGAN: 'Lesen Perkhidmatan Sokongan Pelabuhan',
        PERMIT_AKTIVITI: 'Permit Aktiviti Pelabuhan (PAP)',
        SURAT_PDA2: 'Surat Sokongan PDA2'
      };
      const company = document.getElementById('app-company').value;
      const newRef = 'LPK/' + (type === 'LESEN_SOKONGAN' ? 'LPS' : type === 'PERMIT_AKTIVITI' ? 'PAP' : 'PDA2') + '/2026/' + Math.floor(10000 + Math.random() * 90000);

      state.applications.unshift({
        id: String(Date.now()),
        referenceNo: newRef,
        type: type,
        typeName: typeNames[type],
        company: company,
        status: 'approved',
        statusLabel: 'Diluluskan & Berkuat Kuasa',
        date: 'Hari ini',
        validFrom: '29 Ogos 2026',
        validUntil: '28 Ogos 2027',
        qrToken: 'tok_' + Math.random().toString(36).substring(2, 15)
      });

      alert('Permohonan anda berjaya dihantar dan didaftarkan dengan No. Rujukan: ' + newRef);
      setTab('dashboard');
    }

    // Parse URL for QR Code scan redirections (/semak/:token or ?token=...)
    const path = window.location.pathname;
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromQuery = urlParams.get('token') || urlParams.get('semak');
    
    if (path.includes('/semak/')) {
      const parts = path.split('/semak/');
      const token = parts[1] ? parts[1].split('/')[0].replace(/[^a-zA-Z0-9_-]/g, '') : '';
      if (token) {
        state.semakToken = token;
        state.currentTab = 'semak';
      }
    } else if (tokenFromQuery) {
      state.semakToken = tokenFromQuery;
      state.currentTab = 'semak';
    }

    // Initialize application
    renderApp();
