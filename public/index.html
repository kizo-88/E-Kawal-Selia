    function hasTabAccess(tab) {
      if (!state.isLoggedIn) return false;
      const config = ROLE_CONFIG[state.user.roleKey];
      if (!config) return false;
      return config.allowedTabs.includes(tab);
    }

    function setTab(tab, extra) {
      state.currentTab = tab;
      if (extra && extra.licenceId) state.selectedLicenceId = extra.licenceId;
      if (extra && extra.token) state.semakToken = extra.token;
      state.activeModal = null;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(modalName, data = {}) {
      state.activeModal = modalName;
      state.modalData = data;
      renderApp();
    }

    function closeModal() {
      state.activeModal = null;
      state.modalData = {};
      renderApp();
    }

    function fastLogin(roleKey) {
      const config = ROLE_CONFIG[roleKey] || ROLE_CONFIG.superadmin;
      state.user = {
        name: config.name,
        role: config.role,
        roleKey: config.roleKey,
        email: config.email,
        unit: config.unit,
        phone: config.phone
      };
      state.isLoggedIn = true;
      state.currentTab = 'dashboard';
      state.activeModal = null;
      renderApp();
    }

    function logout() {
      state.isLoggedIn = false;

      if (leafletMapInstance) {
        leafletMapInstance.remove();
        leafletMapInstance = null;
      }
      renderApp();

    function generateQrSvg(text, size = 148) {
      const encodedUrl = encodeURIComponent(text);
      return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodedUrl}&margin=4" width="${size}" height="${size}" alt="Kod QR Sijil LPKmn" class="rounded bg-white p-1 shadow-xs border border-slate-200 block" />`;
    }

    function handleCheckGis(event) {
      if (event) event.preventDefault();
      const lat = parseFloat(document.getElementById('gis-lat').value);
      const lng = parseFloat(document.getElementById('gis-lng').value);

      // Kemaman Port Limits statutory box: lat 4.21 to 4.28 N, lng 103.44 to 103.58 E
      const isInside = lat >= 4.21 && lat <= 4.28 && lng >= 103.44 && lng <= 103.58;

      state.gisQuery = {
        lat: String(lat),
        lng: String(lng),
        result: isInside ? 'INSIDE' : 'OUTSIDE'
      };

      if (leafletMapInstance) {
        leafletMapInstance.setView([lat, lng], 14);
        L.popup()
          .setLatLng([lat, lng])
          .setContent(`<b>Koordinat Disemak:</b><br>${lat}° U, ${lng}° T<br><span style="color:${isInside ? '#059669' : '#dc2626'}; font-weight:bold;">${isInside ? '✓ Di Dalam Had Pelabuhan' : '✗ Di Luar Had Pelabuhan'}</span>`)
          .openOn(leafletMapInstance);
      }

      const resEl = document.getElementById('gis-result-box');
      if (resEl) {
        resEl.innerHTML = isInside ? 
          '<span class="text-emerald-400 font-bold">✓ KOORDINAT BERADA DI DALAM HAD PELABUHAN KEMAMAN</span>' : 
          '<span class="text-rose-400 font-bold">✗ KOORDINAT DI LUAR KAWASAN HAD PELABUHAN KEMAMAN</span>';
      }
    }

    // REAL LEAFLET GIS MAP ENGINE
    let leafletMapInstance = null;

    function initLeafletMap() {
      const container = document.getElementById('leaflet-port-map');
      if (!container || typeof L === 'undefined') return;

      if (leafletMapInstance) {
        leafletMapInstance.remove();
        leafletMapInstance = null;
      }

      // Center at Kemaman Port, Terengganu
      const map = L.map('leaflet-port-map').setView([4.2450, 103.4650], 13);
      leafletMapInstance = map;

      // Base tile layers (OSM & ESRI Satellite)
      const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Lembaga Pelabuhan Kemaman'
      }).addTo(map);

      const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; Port GIS Pelabuhan Kemaman'
      });

      L.control.layers({
        "Peta Vektor / Jalan (OSM)": osmLayer,
        "Peta Satelit Maritim (ESRI)": satelliteLayer
      }, null, { position: 'topright' }).addTo(map);

      // 1. Port Limits Statutory Boundary (Golden dashed polygon)
      const portLimitsCoords = [
        [4.2800, 103.4400],
        [4.2800, 103.5800],
        [4.2100, 103.5800],
        [4.2100, 103.4400]
      ];
      L.polygon(portLimitsCoords, {
        color: '#f59e0b',
        weight: 3,
        dashArray: '8, 6',
        fillColor: '#f59e0b',
        fillOpacity: 0.08
      }).addTo(map).bindPopup('<b>HAD PELABUHAN KEMAMAN (PORT LIMITS)</b><br>Kawasan statutori pewartaan seluas 128.4 km² di bawah Akta Lembaga-Lembaga Pelabuhan 1969.');

      // 2. Dermaga Barat (West Wharf - Free Commercial Zone)
      L.polygon([
        [4.2520, 103.4500],
        [4.2580, 103.4600],
        [4.2540, 103.4650],
        [4.2480, 103.4550]
      ], {
        color: '#2563eb',
        fillColor: '#3b82f6',
        fillOpacity: 0.45
      }).addTo(map).bindPopup('<b>Zon Dermaga Barat (West Wharf)</b><br>Keluasan: 45.2 Hektar (Zon Bebas Cukai). Dermaga kargo am dan kontena.');

      // 3. Dermaga Timur (East Wharf)
      L.polygon([
        [4.2400, 103.4650],
        [4.2460, 103.4750],
        [4.2420, 103.4800],
        [4.2360, 103.4700]
      ], {
        color: '#7c3aed',
        fillColor: '#8b5cf6',
        fillOpacity: 0.45
      }).addTo(map).bindPopup('<b>Zon Dermaga Timur (East Wharf)</b><br>Keluasan: 38.0 Hektar. Dermaga pukal kering dan petroleum.');

      // 4. Kemaman Supply Base (KSB Basin)
      L.polygon([
        [4.2600, 103.4450],
        [4.2680, 103.4550],
        [4.2620, 103.4620],
        [4.2550, 103.4520]
      ], {
        color: '#059669',
        fillColor: '#10b981',
        fillOpacity: 0.5
      }).addTo(map).bindPopup('<b>Pangkalan Bekalan Kemaman (KSB Wharf)</b><br>Pangkalan logistik maritim minyak & gas luar pantai.');

      // 5. Kawasan Sauh Kapal (Anchorage Area MRA)
      L.circle([4.2500, 103.5300], {
        radius: 3500,
        color: '#0284c7',
        dashArray: '5, 5',
        fillColor: '#38bdf8',
        fillOpacity: 0.2
      }).addTo(map).bindPopup('<b>Kawasan Sauh Kapal (Anchorage Area MRA)</b><br>Keluasan: 85.0 km². Lokasi sauh kapal dagang dan tangki minyak.');

      // Interactive Click on Map -> Set Lat/Lng and check boundary
      let clickMarker = null;
      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(4);
        const lng = e.latlng.lng.toFixed(4);

        if (clickMarker) {
          map.removeLayer(clickMarker);
        }
        clickMarker = L.marker([lat, lng]).addTo(map);

        const isInside = lat >= 4.21 && lat <= 4.28 && lng >= 103.44 && lng <= 103.58;
        clickMarker.bindPopup(`<b>Koordinat Disemak:</b><br>${lat}° U, ${lng}° T<br><span style="color:${isInside ? '#059669' : '#dc2626'}; font-weight:bold;">${isInside ? '✓ Di Dalam Had Pelabuhan' : '✗ Di Luar Had Pelabuhan'}</span>`).openPopup();

        const latEl = document.getElementById('gis-lat');
        const lngEl = document.getElementById('gis-lng');
        if (latEl) latEl.value = lat;
        if (lngEl) lngEl.value = lng;
        state.gisQuery = {
          lat: String(lat),
          lng: String(lng),
          result: isInside ? 'INSIDE' : 'OUTSIDE'
        };
        const resEl = document.getElementById('gis-result-box');
        if (resEl) {
          resEl.innerHTML = isInside ? 
            '<span class="text-emerald-400 font-bold">✓ KOORDINAT BERADA DI DALAM HAD PELABUHAN KEMAMAN</span>' : 
            '<span class="text-rose-400 font-bold">✗ KOORDINAT DI LUAR KAWASAN HAD PELABUHAN KEMAMAN</span>';
        }
      });
    }

    function findLicenceByToken(token) {
      if (!token) return state.applications[0];
      const clean = token.trim().toLowerCase();
      const directMatch = state.applications.find(a => 
        a.qrToken.toLowerCase() === clean || 
        a.referenceNo.toLowerCase().replace(/[^a-z0-9]/g, '') === clean.replace(/[^a-z0-9]/g, '') ||
        a.id === clean
      );
      if (directMatch) return directMatch;
      if (clean.includes('3f4e') || clean.includes('pap')) return state.applications[1];
      if (clean.includes('9a8b') || clean.includes('pda')) return state.applications[2];
      return state.applications[0];
    }

                        <option value="Pemeriksaan Bomba &amp; Bahaya">Pemeriksaan Bomba &amp; Bahaya</option>
                      </select>
                    </div>
                  </div>
                  <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-lg cursor-pointer">Batal</button>
                    <button type="submit" class="px-5 py-2 bg-[#0b2545] hover:bg-[#133e87] text-white font-bold rounded-lg cursor-pointer">Jadualkan Lawatan</button>
                  </div>
                </form>
              </div>
            </div>
          `;

        case 'inspection-checklist':
          const insData = state.modalData;
          return `
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden text-xs">
                <div class="bg-[#0b2545] px-6 py-4 text-white flex items-center justify-between">
                  <div>
                    <h3 class="font-bold text-sm">Senarai Semak Keselamatan ISPS &amp; Pelabuhan (M2-2)</h3>
                    <p class="text-[11px] text-slate-300">${insData.refNo} &bull; ${insData.site}</p>
                  </div>
                  <button onclick="closeModal()" class="text-slate-300 hover:text-white font-bold text-base cursor-pointer">&times;</button>
                </div>
                <div class="p-6 space-y-4">
                  <div class="space-y-3">
                    <label class="flex items-start gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                      <input type="checkbox" checked class="mt-0.5 h-4 w-4" />
                      <div>
                        <span class="font-bold text-slate-900 block">1. Kawalan Akses &amp; Pagar Perimeter ISPS</span>
                        <span class="text-slate-500">Pemeriksaan pos kawalan, palang keselamatan dan kad kuasa pelabuhan.</span>
                      </div>
                    </label>
                    <label class="flex items-start gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                      <input type="checkbox" checked class="mt-0.5 h-4 w-4" />
                      <div>
                        <span class="font-bold text-slate-900 block">2. Peralatan Kebakaran &amp; Pam Hidran Dermaga</span>
                        <span class="text-slate-500">Tekanan air hidran mencukupi dan alat pemadam api telah diservis.</span>
                      </div>
                    </label>
                    <label class="flex items-start gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                      <input type="checkbox" checked class="mt-0.5 h-4 w-4" />
                      <div>
                        <span class="font-bold text-slate-900 block">3. Pelan Tindak Balas Tumpahan Minyak (Tier 1)</span>
                        <span class="text-slate-500">Ketersediaan Oil Boom dan dispersant kimia sedia guna.</span>
                      </div>
                    </label>
                  </div>
                  <div class="pt-3 border-t flex items-center justify-between gap-3">
                    <button onclick="handleCompleteInspection('${insData.id}', 'car')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg cursor-pointer">
                      Keluarkan CAR (Ketidakpatuhan)
                    </button>
                    <button onclick="handleCompleteInspection('${insData.id}', 'pass')" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg cursor-pointer">
                      ✓ Sahkan Selesai &amp; Patuh
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;

        case 'asset-loan':
          return `
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden text-xs">
                <div class="bg-[#0b2545] px-6 py-4 text-white flex items-center justify-between">
                  <h3 class="font-bold text-sm">Permohonan Pinjaman Peralatan Keselamatan (M6-1)</h3>
                  <button onclick="closeModal()" class="text-slate-300 hover:text-white font-bold text-base cursor-pointer">&times;</button>
                </div>
                <form onsubmit="handleAssetLoan(event)" class="p-6 space-y-4">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Syarikat Pemohon:</label>
                    <input type="text" name="company" value="${state.user.roleKey === 'applicant' ? state.user.name : 'Kemaman Marine Services Sdn Bhd'}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Peralatan Maritim Dipohon:</label>
                    <select name="equipment" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      <option value="Oil Boom Maritim (500 Meter)">Oil Boom Maritim (500 Meter) - Baki Stok: 4 Unit</option>
                      <option value="Marine Skimmer Oil Recovery">Marine Skimmer Oil Recovery - Baki Stok: 2 Unit</option>
                      <option value="Multi-Gas Detector H2S">Multi-Gas Detector H2S - Baki Stok: 8 Unit</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">Kuantiti:</label>
                      <input type="number" name="quantity" min="1" max="5" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">Tempoh Pinjaman (Hari):</label>
                      <input type="number" name="duration" min="1" max="30" value="7" required class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>
                  <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-lg cursor-pointer">Batal</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg cursor-pointer">Hantar Permohonan Pinjaman</button>
                  </div>
                </form>
              </div>
            </div>
          `;

        case 'fpx-pay':
          const fpxData = state.modalData;
          return `
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden text-xs">
                <div class="bg-[#0b2545] px-6 py-4 text-white flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 bg-amber-400 text-slate-950 font-black rounded text-[10px]">FPX</span>
                    <h3 class="font-bold text-sm">Gerbang Pembayaran Fi Lesen LPKmn (X-1)</h3>
                  </div>
                  <button onclick="closeModal()" class="text-slate-300 hover:text-white font-bold text-base cursor-pointer">&times;</button>
                </div>
                <form onsubmit="handleFpxCheckout(event)" class="p-6 space-y-4">
                  <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                    <div class="flex justify-between">
                      <span class="text-slate-500">No. Permohonan:</span>
                      <span class="font-mono font-bold text-slate-900">${fpxData.appRef || 'LPK/LPS/2026/00142'}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Jumlah Fi Pelesenan:</span>
                      <span class="font-bold text-base text-[#0b2545]">${fpxData.amount || 'RM 2,500.00'}</span>
                    </div>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Pilih Perbankan Internet (FPX):</label>
                    <select name="bank" class="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold">
                      <option value="Maybank2u">Maybank2u (Malayan Banking)</option>
                      <option value="CIMB Clicks">CIMB Clicks</option>
                      <option value="Bank Islam">Bank Islam Internet Banking</option>
                      <option value="Public Bank">Public Bank Online</option>
                      <option value="RHB Now">RHB Now</option>
                    </select>
                  </div>
                  <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-lg cursor-pointer">Batal</button>
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm cursor-pointer">
                      Bayar Sekarang melalui FPX →
                    </button>
                  </div>
                </form>
              </div>
            </div>
          `;

        case 'fpx-receipt':
          const rc = state.modalData;
          return `
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden text-xs">
                <div class="bg-emerald-800 px-6 py-4 text-white flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span>✓</span>
                    <h3 class="font-bold text-sm">Resit Rasmi Pembayaran Berjaya (FPX)</h3>
                  </div>
                  <button onclick="closeModal()" class="text-slate-300 hover:text-white font-bold text-base cursor-pointer">&times;</button>
                </div>
                <div class="p-6 space-y-4" id="printable-receipt">
                  <div class="text-center border-b pb-3 space-y-1">
                    <span class="text-[10px] tracking-widest text-slate-500 font-bold uppercase block">LEMBAGA PELABUHAN KEMAMAN</span>
                    <h4 class="font-extrabold text-base text-slate-900">RESIT RASMI ELEKTRONIK</h4>
                    <p class="font-mono text-xs text-slate-600">${rc.receiptNo}</p>
                  </div>
                  <div class="space-y-2 text-xs">
                    <div class="flex justify-between"><span class="text-slate-500">Tarikh:</span><span class="font-bold text-slate-900">${rc.date || 'Hari ini'}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Pembayar:</span><span class="font-bold text-slate-900">${rc.payer}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">No. Permohonan:</span><span class="font-mono font-bold text-slate-900">${rc.appRef}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Saluran Bayaran:</span><span class="font-bold text-slate-900">${rc.bank}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Rujukan FPX:</span><span class="font-mono font-bold text-slate-900">${rc.ref}</span></div>
                    <div class="pt-2 border-t flex justify-between text-sm"><span class="font-bold text-slate-900">Jumlah Dibayar:</span><span class="font-black text-emerald-700">${rc.amount}</span></div>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-lg border text-center text-[10px] text-slate-400 font-mono">
                    Tandatangan Digital: LPK-SIG-${btoa(rc.receiptNo || 'REC').substring(0, 16)} (Akta Tandatangan Digital 1997)
                  </div>
                  <div class="pt-2 flex justify-between gap-3">
                    <button onclick="window.print()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-lg cursor-pointer">🖨️ Cetak Resit</button>
                    <button onclick="closeModal()" class="px-5 py-2 bg-[#0b2545] text-white font-bold rounded-lg cursor-pointer">Selesai</button>
                  </div>
                </div>
              </div>
            </div>
          `;

        default:
          return '';
      }
    }

    // Parse URL for QR Code scan redirections (/semak/:token or ?token=...)
    const path = window.location.pathname;
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromQuery = urlParams.get('token') || urlParams.get('semak');
    
    if (path.includes('/semak/')) {
      const parts = path.split('/semak/');
      const token = parts[1] ? parts[1].split('/')[0].replace(/[^a-zA-Z0-9_-]/g, '') : '';
      if (token) {
        state.semakToken = token;
        state.currentTab = 'semak';
      }
    } else if (tokenFromQuery) {
      state.semakToken = tokenFromQuery;
      state.currentTab = 'semak';
    }

    // Initialize application
    renderApp();
  </script>
</body>
</html>
